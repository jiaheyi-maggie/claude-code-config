"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Directory + git on line 1, prompt character on line 2
format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$c\
$golang\
$java\
$package\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
style = "bold cyan"
read_only = " 🔒"

[git_branch]
format = " [$branch]($style)"
style = "bold purple"
truncation_length = 20
truncation_symbol = "…"

[git_status]
format = '( [$all_status$ahead_behind]($style))'
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘"

[cmd_duration]
format = " [$duration]($style)"
style = "bold yellow"
min_time = 2000

[python]
format = " [py $version]($style)"
style = "yellow"
version_format = "${major}.${minor}"

[nodejs]
format = " [node $version]($style)"
style = "green"
version_format = "${major}.${minor}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[rust]
format = " [rs $version]($style)"
style = "red"
version_format = "${major}.${minor}"

[c]
format = " [c $version]($style)"
style = "blue"
version_format = "${major}.${minor}"

[golang]
format = " [go $version]($style)"
style = "cyan"
version_format = "${major}.${minor}"

[java]
format = " [java $version]($style)"
style = "red"
version_format = "${major}.${minor}"

[package]
format = " [$version]($style)"
style = "208"
display_private = false

# Disable modules we don't need
[aws]
disabled = true

[gcloud]
disabled = true

[battery]
disabled = true

[time]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true
